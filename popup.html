<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp Number Link</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>WhatsApp Number Link</h1>

    <button type="button" id="scan-page" class="primary">Scan this page</button>
    <p class="hint">Works on the current tab without broad site access.</p>

    <hr />

    <label class="check-row">
      <input type="checkbox" id="auto-scan" />
      Auto-scan all pages (optional)
    </label>
    <p class="hint">
      Opt in to scan every page automatically. You will be asked to grant site access.
    </p>

    <label for="enabled">Extension enabled</label>
    <input type="checkbox" id="enabled" checked />

    <label for="prefix">Default country prefix</label>
    <select id="prefix"></select>

    <label for="custom-prefix">Or custom prefix</label>
    <input type="text" id="custom-prefix" placeholder="+966" />

    <p class="hint">
      Numbers with <strong>+</strong> use their own country code. Others use your default prefix.
    </p>

    <p class="preview" id="preview"></p>

    <button type="button" id="save">Save settings</button>
    <p class="status" id="status"></p>

    <script src="phone.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
